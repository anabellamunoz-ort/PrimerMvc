services:
  - type: web
    name: primermvc
    runtime: docker
    plan: free
    rootDir: primerMvc
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: primermvc-db
          property: connectionString
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

databases:
  - name: primermvc-db
    plan: free
    databaseName: primermvc
    user: primermvc
