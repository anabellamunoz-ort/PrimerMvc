services:
  - type: web
    name: primermvc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: primermvc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: primermvc-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: primermvc-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: primermvc-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: primermvc-db
          property: password
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"

databases:
  - name: primermvc-db
    plan: free
    databaseName: primermvc
    user: primermvc
