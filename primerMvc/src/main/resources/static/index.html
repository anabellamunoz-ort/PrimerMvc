<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.5);
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

        .success {
            color: green;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>

</head>

<body>

<div class="login-container">

    <h2>Iniciar sesión</h2>

    <form id="loginForm">

        <div class="input-group">
            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    required>
        </div>

        <div class="input-group">
            <label for="clave">Clave</label>
            <input
                    type="password"
                    id="clave"
                    name="clave"
                    required>
        </div>

        <button type="submit">Ingresar</button>

    </form>

    <p id="mensaje" class="error"></p>

</div>


<script>

    $("#loginForm").submit(function(event) {

        // Evita que el formulario haga un POST tradicional
        // y recargue la página.
        event.preventDefault();

        // Obtener los valores de los campos
        const email = $("#email").val();
        const clave = $("#clave").val();

        // Petición AJAX
        $.ajax({

            url: "/login",

            type: "POST",

            contentType: "application/json",

            data: JSON.stringify({
                email: email,
                clave: clave
            }),

            success: function(response) {

                console.log("Respuesta del servidor:", response);

                $("#mensaje")
                    .removeClass("error")
                    .addClass("success")
                    .text("Login correcto");

            },

            error: function(xhr) {

                console.error("Error:", xhr);

                $("#mensaje")
                    .removeClass("success")
                    .addClass("error")
                    .text("Email o contraseña incorrectos");

            }

        });

    });

</script>

</body>
</html>
